<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Bootstrap Modal – WCAG AA Compliant</title>

    <link href="Lib/bootstrap/dist/css/bootstrap.css" rel="stylesheet" />
    <script src="Lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <link href="Lib/styles/headers.css" rel="stylesheet" />

    <script src="lib/debugHelper.js"></script>

    <!--suppress no favicon-->
    <link rel="shortcut icon" href="#">

    <style>
        /* Decorative icons should not receive focus – hide from assistive tech */
        .icon {
            width: 1em;
            height: 1em;
            vertical-align: -.125em; /* baseline alignment */
            margin-right: 0.35em; /* tweak as needed */
        }

        .alert {
            margin-bottom: 1px;
            height: 30px;
            line-height:30px;
            padding:0px 15px;
        }
    </style>
</head>
<body>
    <div class="nine mt-3">
        <h1>Bootstrap 5.3 modal <span>with JavaScript to populate</span></h1>
    </div>

    <main>

        <div class="container text-center">
            <!-- Added full-text for screen-reader users; decorative SVG is aria-hidden -->
            <button type="button"
                    class="btn btn-outline-success"
                    onclick="showSearchTips()"
                    aria-controls="searchTipsModal"
                    aria-haspopup="dialog">

                <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-window"></use></svg>
                <span>Demo 1</span>

            </button>





        </div>
    </main>

    <!-- ===== Modal ===== -->
    <div class="modal fade" id="searchTipsModal" tabindex="-1" role="dialog"
         aria-modal="true" aria-labelledby="searchTipsModalLabel" aria-describedby="searchTipsModalDesc">

        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">

                <div class="modal-header">

                    <h2 class="modal-title fs-5 text-start" id="searchTipsModalLabel">Job Search Tips</h2>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div id="searchTipsModalDesc" class="visually-hidden">Jobs search tips.</div>

                    <div class="row mb-2 align-items-center">
                        <div class="col-auto text-end fw-bold">
                            <a href="index.cfm?location_content=jobsearchhelp.cfm&system=WIOH#list_parms#">Job Search Help</a> 
                            &mdash; For help finding jobs, including examples.
                        </div>
                    </div>

                    <div class="row mb-2 align-items-center">
                        <div class="col-auto text-end fw-bold">
                            <a href="index.cfm?location_content=cart-about.cfm&system=new#list_parms#">My Job Basket Help</a> 
                            &mdash; How to use the "My Jobs" basket.
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Close</button>
                </div>

            </div>
        </div>
    </div>

    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <!-- Window icon -->
        <symbol id="icon-window" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M2.5 4a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1m2-.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0m1 .5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1" />
            <path d="M2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm13 2v2H1V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1M2 14a1 1 0 0 1-1-1V6h14v7a1 1 0 1 1-1 1z" />
        </symbol>
    </svg>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.addEventListener('keydown', function (event) {
                if (event.key === '1' && event.altKey && event.ctrlKey) {
                    $debugHelper.toggle(true);
                }
            });
        });

        function showSearchTips() {
     

            // Show dialog and move keyboard focus inside
            const modalElement = document.getElementById('searchTipsModal');
            const modal = new bootstrap.Modal(modalElement);
            modal.show();
        }

        // Auto close the alert after 5 seconds (5000 ms)
        setTimeout(function () {
            const alertElement = document.getElementById('autoCloseAlert');
            if (alertElement) {
                alertElement.classList.remove('show');
                alertElement.style.display = 'none';
            }
        }, 5000);


        function showAutoCloseAlert() {
            const alertElement = document.getElementById('autoCloseAlert');
            if (alertElement) {
                alertElement.style.display = 'block';
                alertElement.classList.add('show');

                // Restart the auto-close timer
                setTimeout(function () {
                    alertElement.classList.remove('show');
                    alertElement.style.display = 'none';
                }, 5000);
            }
        }


    </script>
</body>
</html>
