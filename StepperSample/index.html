<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <title></title>

    <link href="Lib/bootstrap/css/bootstrap.css" rel="stylesheet" />
    <link href="Lib/styles/headers.css" rel="stylesheet" />
    <script src="lib/debugHelper.js"></script>
    <link href="Lib/styles/index.css" rel="stylesheet" />
    <!--suppress no favicon-->
    <link rel="shortcut icon" href="#">

    <!-- styles are here temp and once okay move to a .css file(s) -->
    <style>
    </style>

</head>
<body>
    <div class="nine mt-3">
        <h1>bootstrap <span> v6</span></h1>
    </div>

    <main>

        <div class="container">
  
            <ol class="stepper stepper-horizontal">
                <li class="stepper-item ">Create account</li>
                <li class="stepper-item ">Confirm email</li>
                <li class="stepper-item ">Update profile</li>
                <li class="stepper-item ">Finish</li>
            </ol>

            <div class="row">
                <div class="col-2">
                    <button id="updateStepper"
                            type="button"
                            class="btn-solid theme-primary">
                        Update
                    </button>
                </div>
            </div>

        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            /*
             * Provides the ability to add outlines to every single element on a page
             * Usage: Pass true to toggle for development environment, false for other environments
             * To invoke, press ALT+CTRL+1 which toggles adding/removing debugger.css
            */
            document.addEventListener('keydown', function (event) {

                if (event.key === '1' && event.altKey && event.ctrlKey) {
                    // this is for development environment
                    $debugHelper.toggle(true);
                }

            });

        });

        const updateButton = document.getElementById("updateStepper");
        const steps = document.querySelectorAll(".stepper .stepper-item");

        let currentStep = 0;

        updateButton.addEventListener("click", () => {

            if (currentStep < steps.length) {
                steps[currentStep].classList.add("active");
                currentStep++;
            }

            // Disable button when all steps are active
            if (currentStep === steps.length) {
                updateButton.disabled = true;
            }

        });

    </script>

</body>
</html>
