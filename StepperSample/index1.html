<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <title></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
    <link href="Lib/styles/headers.css" rel="stylesheet" />
    <script src="lib/debugHelper.js"></script>
    <link href="Lib/styles/index.css" rel="stylesheet" />
    <!--suppress no favicon-->
    <link rel="shortcut icon" href="#">

    <!-- 123456 styles are here temp and once okay move to a .css file(s) -->
    <style>
    </style>

</head>
<body>
    <div class="nine mt-3">
        <h1>bootstrap <span> v6 OTP input</span></h1>
    </div>

    <main>

        <div class="container">

            <label for="phone">Phone number</label>
            <div class="otp" data-bs-otp data-bs-groups="[3,4]">
                <input id="phone" type="text" class="otp-input" maxlength="7" aria-label="Verification code">
            </div>

            <label for="masked" class="mt-2">Masked code</label>
            <div class="otp otp-connected" data-bs-otp data-bs-mask="true">
                <input id="masked" type="text" class="otp-input" maxlength="6" aria-label="Masked code">
            </div>

            <div class="row mt-3">
                <a href="https://getbootstrap.com/docs/6.0/forms/otp-input/" target="_blank">Bootstrap OTP Input Documentation</a>
            </div>

        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            /*
             * Provides the ability to add outlines to every single element on a page
             * Usage: Pass true to toggle for development environment, false for other environments
             * To invoke, press ALT+CTRL+1 which toggles adding/removing debugger.css
            */
            document.addEventListener('keydown', function (event) {

                if (event.key === '1' && event.altKey && event.ctrlKey) {
                    // this is for development environment
                    $debugHelper.toggle(true);
                }

            });

            const otpElement = document.querySelector('.otp');
            const otpInput = new bootstrap.OtpInput(otpElement);
        });



    </script>

</body>
</html>
